# Phlox - development Docker Compose stack (hot reload).
#
#   docker compose -f docker-compose.dev.yml up
#
# UI:  http://localhost:3000  (Vite dev server; proxies /api -> :5000)
# API: http://localhost:5000/docs
#
# The whole repo is bind-mounted, so edits to src/ reload in the browser and
# edits to server/ restart uvicorn. Rebuild the image after changing
# package.json, package-lock.json, server/pyproject.toml or server/uv.lock,
# and reset the dependency volumes with:
#
#   docker compose -f docker-compose.dev.yml build
#   docker compose -f docker-compose.dev.yml down -v

name: phlox-dev

services:
    app:
        image: localhost/phlox-dev:latest
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: phlox-dev
        restart: unless-stopped
        init: true
        # Lets the container reach a model server running on the host
        # (Ollama, llama.cpp/llama-server, vLLM, LM Studio) via
        # http://host.docker.internal:11434 in Settings. Remove this line on
        # Docker older than 20.10, which does not know "host-gateway".
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            # Use "127.0.0.1:3000:3000" if you do not want the dev server on the LAN.
            - "3000:3000" # Vite dev server
            - "5000:5000" # FastAPI (uvicorn --reload)
        environment:
            NODE_ENV: development
            SERVER_HOST: 0.0.0.0 # Bind to all interfaces so the ports are reachable
            PORT: "5000"
            # Throwaway key for local dev; override in .env if you reuse the volume.
            DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:-phlox-dev-insecure-key}
            TZ: ${TZ:-Etc/UTC}
            RATE_LIMIT_ENABLED: "false"
            # Dev traffic goes through the Vite proxy, so it is same-origin:
            # the default (empty) keeps CORS closed. Set "*" or an explicit
            # origin only if you call the API cross-origin in dev.
            ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
            # Optional extras:
            # LLM_EXTRA_BODY: '{"extra_body": {"chat_template_kwargs": {"enable_thinking": false}}}'
            # PHLOX_DEMO_MODE: "true"
        volumes:
            - .:/usr/src/app
            # Keep image-installed dependencies out of the host tree.
            - /usr/src/app/node_modules
            - /usr/src/app/server/.venv
            - /usr/src/app/.cache
            - ./data:/usr/src/app/data # Persist the dev database
        # Filesystem watching over a bind mount is unreliable on macOS/Windows.
        # If hot reload stops working, enable polling in vite.config.js:
        #   server: { watch: { usePolling: true } }
        #
        # Linux-only alternative to the port mappings above (no NAT, every port
        # reachable directly):
        # network_mode: host
